spring.application.name=vms-project

# Veritabani baglantisi - degerler ortam degiskenlerinden okunur.
# DB_PASSWORD ve JWT_SECRET zorunludur, varsayilan degeri yoktur.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vms?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
